  // O convite só abre no toque: o evento ConviteGrupoVIP conta quem quis entrar, não quem só abriu a página.
  document.getElementById('entrar').addEventListener('click', function (ev) {

    function ir() { if (!foi) { foi = true; window.location.href = destino; } }

    setTimeout(ir, 400);
  });
